
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Clock</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #090b12;
    color: #f5e9d0;
    font-family: 'Noto Serif JP', serif;
    overflow: hidden;
}

.clock {
    text-align: center;
    padding: 60px 40px;
    border: 1px solid #a63d40;
    background: linear-gradient(145deg, #151923, #090b12);
    box-shadow: 0 0 40px #a63d4030;
    width: 90%;
    max-width: 600px;
}

.japanese {
    font-size: 55px;
    font-weight: 900;
    color: #c94b50;
    letter-spacing: 12px;
}

.subtitle {
    font-size: 13px;
    letter-spacing: 8px;
    color: #aaa;
    margin: 15px 0 40px;
}

.time {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(35px, 10vw, 65px);
    letter-spacing: 5px;
    color: #fff0d5;
    text-shadow: 0 0 20px #c94b50;
}

.date {
    margin-top: 25px;
    font-size: 16px;
    color: #c94b50;
    letter-spacing: 3px;
}

.line {
    width: 60px;
    height: 2px;
    background: #c94b50;
    margin: 30px auto;
}

.quote {
    font-size: 14px;
    color: #aaa;
    letter-spacing: 3px;
}

</style>
</head>

<body>

<div class="clock">

    <div class="japanese">時の流れ</div>

    <div class="subtitle">THE FLOW OF TIME</div>

    <div class="time" id="time">00:00:00</div>

    <div class="line"></div>

    <div class="date" id="date"></div>

    <div class="line"></div>

    <div class="quote">今を生きる — LIVE IN THE MOMENT</div>

</div>

<script>

function updateClock() {
    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString("en-GB");

    document.getElementById("date").textContent =
        now.toLocaleDateString("en-GB", {
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
}

setInterval(updateClock, 1000);
updateClock();

</script>

</body>
</html>
